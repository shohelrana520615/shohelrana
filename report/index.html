<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JL Fair Shop - Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-50 text-gray-800 flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-[#0f172a] text-white flex flex-col justify-between hidden md:flex">
        <div>
            <div class="p-6 flex items-center space-x-3 border-b border-gray-800">
                <div class="bg-indigo-600 p-2 rounded-lg text-xl">🛒</div>
                <div>
                    <h1 class="font-bold text-lg tracking-wide">JL Fair Shop</h1>
                    <p class="text-xs text-gray-400">MANAGEMENT SYSTEM</p>
                </div>
            </div>

            <nav class="p-4 space-y-1">
                <button onclick="switchTab('stock', this)" class="w-full flex items-center space-x-3 bg-emerald-500 text-white px-4 py-3 rounded-xl font-medium shadow-sm transition nav-btn">
                    <span>📦</span><span>Stock Report</span>
                </button>
                <button onclick="switchTab('sales', this)" class="w-full flex items-center space-x-3 text-gray-400 hover:bg-gray-800 hover:text-white px-4 py-3 rounded-xl transition nav-btn">
                    <span>📅</span><span>Date-wise Sales</span>
                </button>
                <button onclick="switchTab('value', this)" class="w-full flex items-center space-x-3 text-gray-400 hover:bg-gray-800 hover:text-white px-4 py-3 rounded-xl transition nav-btn">
                    <span>💰</span><span>Stock Value</span>
                </button>
                <button onclick="switchTab('top', this)" class="w-full flex items-center space-x-3 text-gray-400 hover:bg-gray-800 hover:text-white px-4 py-3 rounded-xl transition nav-btn">
                    <span>🔥</span><span>Top Selling</span>
                </button>
            </nav>
        </div>

        <div class="p-4 border-t border-gray-800 bg-[#0b1120]">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <p class="text-xs text-emerald-400 font-semibold">Admin Panel</p>
                    <p class="text-sm font-bold">Shohel Rana</p>
                </div>
                <button class="bg-red-500/10 text-red-500 text-xs px-3 py-1.5 rounded-lg font-medium">Logout</button>
            </div>
            <div class="text-[11px] text-gray-500 space-y-0.5">
                <p>Developed by: <span class="text-gray-400 font-medium">Shohel Rana</span></p>
                <p>Mobile: +8801641892517</p>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto">
        <header class="bg-white border-b border-gray-200 px-8 py-5 flex items-center justify-between sticky top-0 z-10">
            <div>
                <h2 id="page-title" class="text-2xl font-bold text-gray-900">Inventory Stock Report</h2>
                <p id="live-time" class="text-xs text-gray-500 mt-0.5"></p>
            </div>
            <div class="flex items-center space-x-3">
                <div class="flex items-center space-x-1.5 bg-emerald-50 text-emerald-600 border border-emerald-200 text-xs font-semibold px-3 py-2 rounded-lg">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                    <span>LIVE SERVER</span>
                </div>
            </div>
        </header>

        <div class="p-8 space-y-6 max-w-7xl w-full mx-auto">
            <!-- Stat Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-xs">
                    <p id="card-label-1" class="text-xs font-medium text-gray-500 uppercase tracking-wider">Total Products</p>
                    <h3 id="card-val-1" class="text-3xl font-extrabold text-gray-900 mt-2">0</h3>
                </div>
                <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-xs">
                    <p id="card-label-2" class="text-xs font-medium text-gray-500 uppercase tracking-wider">Total Current Stock</p>
                    <h3 id="card-val-2" class="text-3xl font-extrabold text-indigo-600 mt-2">0</h3>
                </div>
                <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-xs">
                    <p class="text-xs font-medium text-gray-500 uppercase tracking-wider">Status</p>
                    <h3 class="text-3xl font-extrabold text-emerald-500 mt-2">Online</h3>
                </div>
            </div>

            <!-- Table -->
            <div class="bg-white rounded-2xl border border-gray-200 shadow-xs overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr id="table-header" class="border-b border-gray-200 text-gray-400 text-xs font-semibold tracking-wider bg-gray-50/50">
                                <!-- Dynamic Headers -->
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-gray-100 text-sm font-medium text-gray-700">
                            <!-- Dynamic Rows -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('live-time').innerText = new Date().toLocaleString();
        let currentTab = 'stock';

        function switchTab(tab, btn) {
            currentTab = tab;
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.className = "w-full flex items-center space-x-3 text-gray-400 hover:bg-gray-800 hover:text-white px-4 py-3 rounded-xl transition nav-btn";
            });
            btn.className = "w-full flex items-center space-x-3 bg-emerald-500 text-white px-4 py-3 rounded-xl font-medium shadow-sm transition nav-btn";
            loadData();
        }

        async function loadData() {
            try {
                if (currentTab === 'stock') {
                    document.getElementById('page-title').innerText = "Inventory Stock Report";
                    document.getElementById('card-label-1').innerText = "Total Products";
                    document.getElementById('card-label-2').innerText = "Total Current Stock";
                    
                    let res = await fetch('/api/inventory-data');
                    let data = await res.json();
                    document.getElementById('card-val-1').innerText = data.total_products;
                    document.getElementById('card-val-2').innerHTML = `${data.total_current_stock} <span class="text-lg font-normal text-gray-500">Units</span>`;
                    
                    document.getElementById('table-header').innerHTML = `<th class="py-4 px-6">CODE</th><th class="py-4 px-6">NAME</th><th class="py-4 px-6 text-center">TOTAL STOCK</th><th class="py-4 px-6 text-center">SOLD STOCK</th><th class="py-4 px-6 text-center">CURRENT STOCK</th>`;
                    let tbody = document.getElementById('table-body');
                    tbody.innerHTML = '';
                    data.products.forEach(item => {
                        tbody.innerHTML += `<tr class="hover:bg-gray-50/80 transition"><td class="py-4 px-6 text-gray-500">${item.code}</td><td class="py-4 px-6 font-semibold text-gray-900">${item.name}</td><td class="py-4 px-6 text-center text-gray-600">${item.total_stock}</td><td class="py-4 px-6 text-center text-gray-600">${item.sold_stock}</td><td class="py-4 px-6 text-center font-bold text-indigo-600">${item.current_stock}</td></tr>`;
                    });

                } else if (currentTab === 'sales') {
                    document.getElementById('page-title').innerText = "Date-wise Sales Report";
                    document.getElementById('card-label-1').innerText = "Recent Sales Records";
                    document.getElementById('card-label-2').innerText = "System Status";
                    
                    let res = await fetch('/api/sales-data');
                    let data = await res.json();
                    document.getElementById('card-val-1').innerText = data.sales.length;
                    document.getElementById('card-val-2').innerText = "Active";

                    document.getElementById('table-header').innerHTML = `<th class="py-4 px-6">PRODUCT NAME</th><th class="py-4 px-6 text-center">QTY</th><th class="py-4 px-6 text-center">TOTAL (TK)</th><th class="py-4 px-6 text-center">DATE</th>`;
                    let tbody = document.getElementById('table-body');
                    tbody.innerHTML = '';
                    data.sales.forEach(item => {
                        tbody.innerHTML += `<tr class="hover:bg-gray-50/80 transition"><td class="py-4 px-6 font-semibold text-gray-900">${item.name}</td><td class="py-4 px-6 text-center text-gray-600">${item.qty}</td><td class="py-4 px-6 text-center font-bold text-indigo-600">৳${item.total}</td><td class="py-4 px-6 text-center text-gray-500">${item.date}</td></tr>`;
                    });

                } else if (currentTab === 'value') {
                    document.getElementById('page-title').innerText = "Stock Value Report";
                    document.getElementById('card-label-1').innerText = "Inventory Valuation";
                    let res = await fetch('/api/stock-value');
                    let data = await res.json();
                    let totalVal = data.items.reduce((acc, item) => acc + item.total_val, 0);
                    document.getElementById('card-val-1').innerText = `৳${totalVal.toFixed(2)}`;
                    document.getElementById('card-val-2').innerText = data.items.length + " Items";

                    document.getElementById('table-header').innerHTML = `<th class="py-4 px-6">CODE</th><th class="py-4 px-6">NAME</th><th class="py-4 px-6 text-center">QTY</th><th class="py-4 px-6 text-center">PURCHASE PRICE</th><th class="py-4 px-6 text-center">TOTAL VALUE</th>`;
                    let tbody = document.getElementById('table-body');
                    tbody.innerHTML = '';
                    data.items.forEach(item => {
                        tbody.innerHTML += `<tr class="hover:bg-gray-50/80 transition"><td class="py-4 px-6 text-gray-500">${item.code}</td><td class="py-4 px-6 font-semibold text-gray-900">${item.name}</td><td class="py-4 px-6 text-center text-gray-600">${item.qty}</td><td class="py-4 px-6 text-center text-gray-600">৳${item.p_price}</td><td class="py-4 px-6 text-center font-bold text-indigo-600">৳${item.total_val}</td></tr>`;
                    });

                } else if (currentTab === 'top') {
                    document.getElementById('page-title').innerText = "Top Selling Products";
                    let res = await fetch('/api/top-selling');
                    let data = await res.json();
                    document.getElementById('card-val-1').innerText = data.top.length;
                    document.getElementById('card-val-2').innerText = "Best Sellers";

                    document.getElementById('table-header').innerHTML = `<th class="py-4 px-6">PRODUCT NAME</th><th class="py-4 px-6 text-center">TOTAL SOLD QTY</th><th class="py-4 px-6 text-center">TOTAL REVENUE</th>`;
                    let tbody = document.getElementById('table-body');
                    tbody.innerHTML = '';
                    data.top.forEach(item => {
                        tbody.innerHTML += `<tr class="hover:bg-gray-50/80 transition"><td class="py-4 px-6 font-semibold text-gray-900">${item.name}</td><td class="py-4 px-6 text-center font-bold text-indigo-600">${item.total_sold}</td><td class="py-4 px-6 text-center text-gray-600">৳${item.revenue}</td></tr>`;
                    });
                }
            } catch (err) {
                console.error('Error loading tab data:', err);
            }
        }

        loadData();
        setInterval(loadData, 10000);
    </script>
</body>
</html>
