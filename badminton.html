<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JL Fashions Ltd. - Badminton Tournament Management System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .digital-font { font-family: monospace; font-weight: 800; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg bg-indigo-600 flex items-center justify-center font-black text-xl text-white shadow-lg">JL</div>
                <div>
                    <h1 class="font-extrabold text-lg tracking-tight leading-none text-white">JL Fashions Ltd.</h1>
                    <p class="text-xs text-indigo-400 font-medium">Badminton Tournament Admin</p>
                </div>
            </div>

            <nav class="hidden md:flex space-x-1 bg-slate-950/60 p-1.5 rounded-xl border border-slate-800">
                <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center space-x-1.5 text-indigo-400 bg-indigo-950/60 border border-indigo-800">
                    <i data-lucide="sliders" class="w-4 h-4"></i><span>Settings & Rules</span>
                </button>
                <button onclick="switchTab('teams')" id="nav-teams" class="nav-btn px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center space-x-1.5 text-slate-400">
                    <i data-lucide="users" class="w-4 h-4"></i><span>Teams</span>
                </button>
                <button onclick="switchTab('fixtures')" id="nav-fixtures" class="nav-btn px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center space-x-1.5 text-slate-400">
                    <i data-lucide="calendar" class="w-4 h-4"></i><span>Fixtures</span>
                </button>
                <button onclick="switchTab('scorekeeper')" id="nav-scorekeeper" class="nav-btn px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center space-x-1.5 text-slate-400">
                    <i data-lucide="gamepad-2" class="w-4 h-4"></i><span>Live Scorekeeper</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
        <!-- SETTINGS TAB -->
        <section id="tab-settings" class="tab-content space-y-6">
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 flex justify-between items-center">
                <h2 class="text-xl font-bold">Tournament Settings</h2>
                <button onclick="saveState()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl text-white text-sm">Save Rules</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-900/80 p-6 rounded-2xl border border-slate-800">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Target Points Per Set</label>
                    <select id="cfgTargetPoints" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm">
                        <option value="11">11 Points</option>
                        <option value="15">15 Points</option>
                        <option value="21" selected>21 Points (Standard)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Max Sets (Best of)</label>
                    <select id="cfgMaxSets" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm">
                        <option value="1">1 Set</option>
                        <option value="3" selected>Best of 3</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- TEAMS TAB -->
        <section id="tab-teams" class="tab-content hidden space-y-6">
            <div class="bg-slate-900/80 p-6 rounded-2xl border border-slate-800 space-y-4">
                <h3 class="font-bold text-lg">Add New Team</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="teamName" placeholder="Team/Player Name (e.g. Rafiq & Karim)" class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm">
                    <input type="text" id="teamDept" placeholder="Department (e.g. Merchandising)" class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm">
                    <button onclick="addTeam()" class="bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl text-white text-sm">Add Team</button>
                </div>
            </div>
            <div class="bg-slate-900/80 p-6 rounded-2xl border border-slate-800">
                <h3 class="font-bold text-lg mb-4">Registered Teams</h3>
                <div id="teamsList" class="space-y-2"></div>
            </div>
        </section>

        <!-- FIXTURES TAB -->
        <section id="tab-fixtures" class="tab-content hidden space-y-6">
            <div class="bg-slate-900/80 p-6 rounded-2xl border border-slate-800 space-y-4">
                <h3 class="font-bold text-lg">Schedule Match</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <select id="fixTeamA" class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm"></select>
                    <select id="fixTeamB" class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm"></select>
                    <button onclick="addFixture()" class="bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl text-white text-sm">Create Match</button>
                </div>
            </div>
            <div id="fixturesList" class="space-y-3"></div>
        </section>

        <!-- SCOREKEEPER TAB -->
        <section id="tab-scorekeeper" class="tab-content hidden space-y-6">
            <div id="activeMatchScorer" class="bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 space-y-6"></div>
        </section>
    </main>

    <script>
        // FIREBASE SETUP WITH YOUR URL
        const firebaseConfig = {
            databaseURL: "https://jl-badminton-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let state = {
            settings: { targetPoints: 21, maxSets: 3 },
            teams: [
                { id: "t1", name: "Rafiq & Karim", dept: "Merchandising", group: "Group A" },
                { id: "t2", name: "Sajjad & Arif", dept: "HR & Admin", group: "Group A" }
            ],
            fixtures: [
                { id: "m1", stage: "Group Stage", court: "Court 1", teamA: "t1", teamB: "t2", status: "LIVE", scoreA: 0, scoreB: 0, setsA: 0, setsB: 0, currentSet: 1, servingTeam: "A" }
            ],
            activeMatchId: "m1"
        };

        db.ref("tournament_state").on("value", (snapshot) => {
            const data = snapshot.val();
            if (data) {
                state = data;
                renderAll();
            }
        });

        function saveState() {
            state.settings.targetPoints = parseInt(document.getElementById("cfgTargetPoints").value);
            state.settings.maxSets = parseInt(document.getElementById("cfgMaxSets").value);
            db.ref("tournament_state").set(state);
        }

        function addTeam() {
            const name = document.getElementById("teamName").value;
            const dept = document.getElementById("teamDept").value;
            if (name) {
                state.teams.push({ id: "t_" + Date.now(), name, dept, group: "Group A" });
                saveState();
            }
        }

        function addFixture() {
            const teamA = document.getElementById("fixTeamA").value;
            const teamB = document.getElementById("fixTeamB").value;
            if (teamA !== teamB) {
                state.fixtures.push({ id: "m_" + Date.now(), stage: "Group Stage", court: "Court 1", teamA, teamB, status: "LIVE", scoreA: 0, scoreB: 0, setsA: 0, setsB: 0, currentSet: 1, servingTeam: "A" });
                saveState();
            }
        }

        function setLiveMatch(id) {
            state.activeMatchId = id;
            saveState();
            switchTab("scorekeeper");
        }

        function addPoint(team) {
            const m = state.fixtures.find(x => x.id === state.activeMatchId);
            if (!m) return;
            if (team === 'A') { m.scoreA++; m.servingTeam = 'A'; }
            else { m.scoreB++; m.servingTeam = 'B'; }

            const target = state.settings.targetPoints;
            if (m.scoreA >= target) { m.setsA++; m.scoreA = 0; m.scoreB = 0; m.currentSet++; }
            if (m.scoreB >= target) { m.setsB++; m.scoreA = 0; m.scoreB = 0; m.currentSet++; }

            saveState();
        }

        function switchTab(tabId) {
            document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
            document.getElementById(`tab-${tabId}`).classList.remove("hidden");
        }

        function renderAll() {
            document.getElementById("teamsList").innerHTML = state.teams.map(t => `<div class="p-2 bg-slate-950 rounded-lg text-sm font-bold">${t.name} (${t.dept})</div>`).join("");
            const opts = state.teams.map(t => `<option value="${t.id}">${t.name}</option>`).join("");
            document.getElementById("fixTeamA").innerHTML = opts;
            document.getElementById("fixTeamB").innerHTML = opts;

            document.getElementById("fixturesList").innerHTML = state.fixtures.map(f => {
                const tA = state.teams.find(t => t.id === f.teamA)?.name || "Team A";
                const tB = state.teams.find(t => t.id === f.teamB)?.name || "Team B";
                return `<div class="p-4 bg-slate-950 rounded-xl flex justify-between items-center font-bold"><span>${tA} VS ${tB}</span><button onclick="setLiveMatch('${f.id}')" class="px-3 py-1 bg-indigo-600 text-xs rounded-lg">Score Now</button></div>`;
            }).join("");

            const m = state.fixtures.find(x => x.id === state.activeMatchId) || state.fixtures[0];
            if (m) {
                const tA = state.teams.find(t => t.id === m.teamA) || { name: "Team A", dept: "-" };
                const tB = state.teams.find(t => t.id === m.teamB) || { name: "Team B", dept: "-" };

                document.getElementById("activeMatchScorer").innerHTML = `
                    <div class="grid grid-cols-2 gap-6 text-center">
                        <div class="bg-slate-950 p-6 rounded-2xl border ${m.servingTeam === 'A' ? 'border-emerald-500' : 'border-slate-800'}">
                            <h3 class="text-2xl font-black">${tA.name}</h3>
                            <div class="text-7xl font-black digital-font my-4">${(m.scoreA || 0).toString().padStart(2, '0')}</div>
                            <button onclick="addPoint('A')" class="w-full py-3 bg-emerald-600 font-bold rounded-xl">+1 Point Team A</button>
                        </div>
                        <div class="bg-slate-950 p-6 rounded-2xl border ${m.servingTeam === 'B' ? 'border-emerald-500' : 'border-slate-800'}">
                            <h3 class="text-2xl font-black">${tB.name}</h3>
                            <div class="text-7xl font-black digital-font my-4">${(m.scoreB || 0).toString().padStart(2, '0')}</div>
                            <button onclick="addPoint('B')" class="w-full py-3 bg-emerald-600 font-bold rounded-xl">+1 Point Team B</button>
                        </div>
                    </div>
                `;
            }
            lucide.createIcons();
        }
    </script>
</body>
</html>
