<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JL Fashions Ltd. - Badminton Tournament Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .digital-font { font-family: monospace; font-weight: 800; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-black text-xl text-white shadow-lg shadow-indigo-500/30">JL</div>
                <div>
                    <h1 class="font-black text-base tracking-tight leading-none text-white">JL Fashions Ltd.</h1>
                    <p class="text-[11px] text-indigo-400 font-semibold">Badminton Tournament Portal</p>
                </div>
            </div>

            <!-- Nav Tabs -->
            <nav class="hidden md:flex space-x-1 bg-slate-950/60 p-1.5 rounded-xl border border-slate-800/80">
                <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn px-3 py-1.5 rounded-lg text-xs font-bold flex items-center space-x-2 text-slate-400 hover:text-white transition-all">
                    <i data-lucide="sliders" class="w-3.5 h-3.5"></i><span>Settings & Rules</span>
                </button>
                <button onclick="switchTab('teams')" id="nav-teams" class="nav-btn px-3 py-1.5 rounded-lg text-xs font-bold flex items-center space-x-2 text-slate-400 hover:text-white transition-all">
                    <i data-lucide="users" class="w-3.5 h-3.5"></i><span>Teams & Players</span>
                </button>
                <button onclick="switchTab('standings')" id="nav-standings" class="nav-btn px-3 py-1.5 rounded-lg text-xs font-bold flex items-center space-x-2 text-slate-400 hover:text-white transition-all">
                    <i data-lucide="layers" class="w-3.5 h-3.5"></i><span>Group Standings</span>
                </button>
                <button onclick="switchTab('fixtures')" id="nav-fixtures" class="nav-btn px-3 py-1.5 rounded-lg text-xs font-bold flex items-center space-x-2 text-slate-400 hover:text-white transition-all">
                    <i data-lucide="calendar" class="w-3.5 h-3.5"></i><span>Fixtures & Schedule</span>
                </button>
                <button onclick="switchTab('scorekeeper')" id="nav-scorekeeper" class="nav-btn px-3 py-1.5 rounded-lg text-xs font-bold flex items-center space-x-2 text-indigo-400 bg-indigo-950/80 border border-indigo-700/50 shadow-inner">
                    <i data-lucide="gamepad-2" class="w-3.5 h-3.5"></i><span>Live Scorekeeper</span>
                </button>
            </nav>

            <div class="flex items-center space-x-3">
                <a href="tv.html" target="_blank" class="px-4 py-2 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/40 rounded-xl text-xs font-extrabold flex items-center space-x-2 transition-all">
                    <i data-lucide="tv" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">TV Spectator View</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
        
        <!-- SCOREKEEPER TAB -->
        <section id="tab-scorekeeper" class="tab-content space-y-6">
            <div class="flex items-center justify-between bg-slate-900/60 p-4 rounded-2xl border border-slate-800">
                <div class="flex items-center space-x-3">
                    <span class="px-3 py-1 bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 text-xs font-black rounded-lg uppercase tracking-wider" id="currentMatchMetaBadge">GROUP STAGE • COURT 1</span>
                    <h2 class="text-lg font-black text-white">Live Match Scorer</h2>
                </div>
                <button onclick="undoLastPoint()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold flex items-center space-x-1.5 transition-all">
                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i><span>Undo Last Point</span>
                </button>
            </div>

            <!-- Score Cards Container -->
            <div id="activeMatchScorerContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Dynamically Rendered Live Match Scorer -->
            </div>
        </section>

        <!-- SETTINGS TAB -->
        <section id="tab-settings" class="tab-content hidden space-y-6">
            <div class="bg-slate-900/80 p-6 rounded-3xl border border-slate-800 flex justify-between items-center">
                <div>
                    <h2 class="text-xl font-black text-white">Tournament Rules & Settings</h2>
                    <p class="text-xs text-slate-400 mt-0.5">Configure points, sets, and group qualification rules.</p>
                </div>
                <button onclick="saveStateToCloud()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 font-extrabold rounded-xl text-white text-xs shadow-lg shadow-indigo-600/30 transition-all">Save Changes</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-slate-900/60 p-6 rounded-3xl border border-slate-800 space-y-3">
                    <label class="block text-xs font-extrabold uppercase text-slate-400 tracking-wider">Target Points Per Set</label>
                    <select id="cfgTargetPoints" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm font-bold text-white focus:outline-none focus:border-indigo-500">
                        <option value="11">11 Points</option>
                        <option value="15">15 Points</option>
                        <option value="21" selected>21 Points (Standard)</option>
                    </select>
                </div>
                <div class="bg-slate-900/60 p-6 rounded-3xl border border-slate-800 space-y-3">
                    <label class="block text-xs font-extrabold uppercase text-slate-400 tracking-wider">Max Sets (Best of)</label>
                    <select id="cfgMaxSets" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm font-bold text-white focus:outline-none focus:border-indigo-500">
                        <option value="1">1 Set</option>
                        <option value="3" selected>Best of 3 Sets</option>
                        <option value="5">Best of 5 Sets</option>
                    </select>
                </div>
                <div class="bg-slate-900/60 p-6 rounded-3xl border border-slate-800 space-y-3">
                    <label class="block text-xs font-extrabold uppercase text-slate-400 tracking-wider">Top Advance Per Group</label>
                    <input type="number" id="cfgAdvanceCount" value="2" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm font-bold text-white focus:outline-none focus:border-indigo-500">
                </div>
            </div>
        </section>

        <!-- TEAMS TAB -->
        <section id="tab-teams" class="tab-content hidden space-y-6">
            <div class="bg-slate-900/80 p-6 rounded-3xl border border-slate-800 space-y-4">
                <h3 class="font-black text-lg text-white">Register New Team</h3>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <input type="text" id="teamNameInput" placeholder="Team Name (e.g. Rafiq & Karim)" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
                    <input type="text" id="teamDeptInput" placeholder="Department (e.g. Merchandising)" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
                    <select id="teamGroupInput" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
                        <option value="Group A">Group A</option>
                        <option value="Group B">Group B</option>
                        <option value="Group C">Group C</option>
                        <option value="Group D">Group D</option>
                    </select>
                </div>
                <button onclick="addTeam()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xs rounded-xl shadow-lg shadow-indigo-600/30 transition-all">Add Team</button>
            </div>
            <div class="bg-slate-900/80 p-6 rounded-3xl border border-slate-800">
                <h3 class="font-black text-lg text-white mb-4">Registered Teams List</h3>
                <div id="teamsListContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
            </div>
        </section>

        <!-- STANDINGS TAB -->
        <section id="tab-standings" class="tab-content hidden space-y-6">
            <div class="bg-slate-900/80 p-6 rounded-3xl border border-slate-800">
                <h2 class="text-xl font-black text-white mb-4">Group Standings & Points Table</h2>
                <div id="standingsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
            </div>
        </section>

        <!-- FIXTURES TAB -->
        <section id="tab-fixtures" class="tab-content hidden space-y-6">
            <div class="bg-slate-900/80 p-6 rounded-3xl border border-slate-800 space-y-4">
                <h3 class="font-black text-lg text-white">Create New Match Fixture</h3>
                <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
                    <select id="fixTeamA" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none"></select>
                    <select id="fixTeamB" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none"></select>
                    <select id="fixStage" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none">
                        <option value="Group Stage">Group Stage</option>
                        <option value="Quarter Final">Quarter Final</option>
                        <option value="Semi Final">Semi Final</option>
                        <option value="Final">Final</option>
                    </select>
                    <button onclick="addFixture()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xs rounded-xl shadow-lg transition-all">Schedule Match</button>
                </div>
            </div>
            <div id="fixturesListContainer" class="space-y-3"></div>
        </section>

    </main>

    <!-- CORE SCRIPT WITH FIREBASE -->
    <script>
        // FIREBASE CONFIG WITH YOUR URL
        const firebaseConfig = {
            databaseURL: "https://jl-badminton-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let state = {
            settings: { targetPoints: 21, maxSets: 3, advanceCount: 2, winPoints: 2, lossPoints: 0 },
            teams: [
                { id: "t1", name: "Rafiq & Karim", dept: "Merchandising", group: "Group A" },
                { id: "t2", name: "Sajjad & Arif", dept: "HR & Admin", group: "Group A" }
            ],
            fixtures: [
                { id: "m1", stage: "Group Stage", court: "Court 1", teamA: "t1", teamB: "t2", status: "LIVE", scoreA: 0, scoreB: 0, setsA: 0, setsB: 0, currentSet: 1, servingTeam: "A", history: [] }
            ],
            activeMatchId: "m1"
        };

        // Realtime sync listener
        db.ref("tournament_state").on("value", (snapshot) => {
            const data = snapshot.val();
            if (data) {
                state = data;
                renderAll();
            }
        });

        function saveStateToCloud() {
            state.settings.targetPoints = parseInt(document.getElementById("cfgTargetPoints").value);
            state.settings.maxSets = parseInt(document.getElementById("cfgMaxSets").value);
            state.settings.advanceCount = parseInt(document.getElementById("cfgAdvanceCount").value);
            db.ref("tournament_state").set(state);
        }

        function switchTab(tabId) {
            document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
            document.querySelectorAll(".nav-btn").forEach(el => {
                el.classList.remove("text-indigo-400", "bg-indigo-950/80", "border", "border-indigo-700/50", "shadow-inner");
                el.classList.add("text-slate-400");
            });
            document.getElementById(`tab-${tabId}`).classList.remove("hidden");
            const btn = document.getElementById(`nav-${tabId}`);
            if (btn) {
                btn.classList.remove("text-slate-400");
                btn.classList.add("text-indigo-400", "bg-indigo-950/80", "border", "border-indigo-700/50", "shadow-inner");
            }
            renderAll();
        }

        function addTeam() {
            const name = document.getElementById("teamNameInput").value.trim();
            const dept = document.getElementById("teamDeptInput").value.trim();
            const group = document.getElementById("teamGroupInput").value;
            if (name) {
                state.teams.push({ id: "t_" + Date.now(), name, dept: dept || "General", group });
                document.getElementById("teamNameInput").value = "";
                document.getElementById("teamDeptInput").value = "";
                db.ref("tournament_state").set(state);
            }
        }

        function addFixture() {
            const teamA = document.getElementById("fixTeamA").value;
            const teamB = document.getElementById("fixTeamB").value;
            const stage = document.getElementById("fixStage").value;
            if (teamA && teamB && teamA !== teamB) {
                state.fixtures.push({
                    id: "m_" + Date.now(), stage, court: "Court 1", teamA, teamB,
                    status: "PENDING", scoreA: 0, scoreB: 0, setsA: 0, setsB: 0, currentSet: 1, servingTeam: "A", history: []
                });
                db.ref("tournament_state").set(state);
            }
        }

        function setLiveMatch(id) {
            state.fixtures.forEach(f => { if (f.status === "LIVE") f.status = "PENDING"; });
            const match = state.fixtures.find(x => x.id === id);
            if (match) {
                match.status = "LIVE";
                state.activeMatchId = id;
            }
            db.ref("tournament_state").set(state);
            switchTab("scorekeeper");
        }

        function addPoint(team) {
            const m = state.fixtures.find(x => x.id === state.activeMatchId);
            if (!m || m.status !== "LIVE") return;

            m.history.push(JSON.parse(JSON.stringify(m)));

            if (team === 'A') { m.scoreA++; m.servingTeam = 'A'; }
            else { m.scoreB++; m.servingTeam = 'B'; }

            const target = state.settings.targetPoints;
            const maxSetsAllowed = state.settings.maxSets;
            const setsToWin = Math.ceil(maxSetsAllowed / 2);

            if ((m.scoreA >= target && m.scoreA - m.scoreB >= 2) || (m.scoreA >= 30)) {
                m.setsA++;
                if (m.setsA >= setsToWin || m.currentSet >= maxSetsAllowed) {
                    m.status = "COMPLETED";
                } else {
                    m.currentSet++;
                    m.scoreA = 0; m.scoreB = 0;
                }
            } else if ((m.scoreB >= target && m.scoreB - m.scoreA >= 2) || (m.scoreB >= 30)) {
                m.setsB++;
                if (m.setsB >= setsToWin || m.currentSet >= maxSetsAllowed) {
                    m.status = "COMPLETED";
                } else {
                    m.currentSet++;
                    m.scoreA = 0; m.scoreB = 0;
                }
            }
            db.ref("tournament_state").set(state);
        }

        function undoLastPoint() {
            const m = state.fixtures.find(x => x.id === state.activeMatchId);
            if (m && m.history && m.history.length > 0) {
                const prev = m.history.pop();
                m.scoreA = prev.scoreA;
                m.scoreB = prev.scoreB;
                m.setsA = prev.setsA;
                m.setsB = prev.setsB;
                m.currentSet = prev.currentSet;
                m.servingTeam = prev.servingTeam;
                m.status = prev.status;
                db.ref("tournament_state").set(state);
            }
        }

        function renderAll() {
            // Teams dropdowns
            const opts = state.teams.map(t => `<option value="${t.id}">${t.name} (${t.group})</option>`).join("");
            const elA = document.getElementById("fixTeamA");
            const elB = document.getElementById("fixTeamB");
            if (elA) elA.innerHTML = opts;
            if (elB) elB.innerHTML = opts;

            // Teams list
            const teamCont = document.getElementById("teamsListContainer");
            if (teamCont) {
                teamCont.innerHTML = state.teams.map(t => `
                    <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800/80 flex justify-between items-center">
                        <div>
                            <h4 class="font-extrabold text-sm text-white">${t.name}</h4>
                            <p class="text-xs text-indigo-400 font-semibold">${t.dept} • ${t.group}</p>
                        </div>
                    </div>
                `).join("");
            }

            // Fixtures list
            const fixCont = document.getElementById("fixturesListContainer");
            if (fixCont) {
                fixCont.innerHTML = state.fixtures.map(f => {
                    const tA = state.teams.find(t => t.id === f.teamA)?.name || "Team A";
                    const tB = state.teams.find(t => t.id === f.teamB)?.name || "Team B";
                    return `
                        <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800/80 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div>
                                <span class="text-[10px] font-black uppercase text-indigo-400 bg-indigo-950/60 px-2 py-0.5 rounded border border-indigo-800/50">${f.stage}</span>
                                <h4 class="font-black text-base text-white mt-1">${tA} <span class="text-slate-500 font-normal">VS</span> ${tB}</h4>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="text-xs font-bold px-3 py-1 rounded-lg ${f.status === 'LIVE' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-slate-800 text-slate-400'}">${f.status}</span>
                                <button onclick="setLiveMatch('${f.id}')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-extrabold transition-all">Set Live & Score</button>
                            </div>
                        </div>
                    `;
                }).join("");
            }

            // Active Match Scorer
            const m = state.fixtures.find(x => x.id === state.activeMatchId) || state.fixtures.find(x => x.status === "LIVE") || state.fixtures[0];
            const scorerCont = document.getElementById("activeMatchScorerContainer");
            if (m && scorerCont) {
                const teamA = state.teams.find(t => t.id === m.teamA) || { name: "Team A", dept: "-" };
                const teamB = state.teams.find(t => t.id === m.teamB) || { name: "Team B", dept: "-" };

                document.getElementById("currentMatchMetaBadge").innerText = `${m.stage.toUpperCase()} • ${m.court || 'Court 1'} (TARGET: ${state.settings.targetPoints} PTS)`;

                scorerCont.innerHTML = `
                    <!-- TEAM A SCORER -->
                    <div class="bg-slate-900 border-2 ${m.servingTeam === 'A' ? 'border-emerald-500 shadow-xl shadow-emerald-500/10' : 'border-slate-800'} rounded-3xl p-6 sm:p-8 flex flex-col justify-between relative transition-all">
                        ${m.servingTeam === 'A' ? '<div class="absolute top-4 right-4 px-3 py-1 bg-emerald-500 text-slate-950 font-black text-xs rounded-full flex items-center gap-1 shadow"><i data-lucide="zap" class="w-3.5 h-3.5"></i> SERVING</div>' : ''}
                        <div>
                            <span class="text-xs font-black tracking-widest text-indigo-400 uppercase">${teamA.dept}</span>
                            <h3 class="text-3xl font-black text-white mt-1">${teamA.name}</h3>
                        </div>
                        <div class="bg-slate-950 rounded-2xl p-6 text-center border border-slate-800/80 my-6">
                            <span class="text-xs font-bold text-slate-500 uppercase block mb-1">Current Score</span>
                            <span class="text-8xl font-black text-white digital-font tracking-tight">${m.scoreA.toString().padStart(2, '0')}</span>
                        </div>
                        <div class="space-y-4">
                            <div class="flex items-center justify-between text-sm font-bold text-slate-400">
                                <span>Sets Won: <span class="text-indigo-400 font-extrabold text-xl">${m.setsA}</span></span>
                                <span class="px-3 py-1 bg-slate-800 rounded-lg text-xs">Set ${m.currentSet} of ${state.settings.maxSets}</span>
                            </div>
                            <button onclick="addPoint('A')" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-black rounded-2xl text-base shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center space-x-2">
                                <i data-lucide="plus-circle" class="w-5 h-5"></i><span>+1 Point Team A</span>
                            </button>
                        </div>
                    </div>

                    <!-- TEAM B SCORER -->
                    <div class="bg-slate-900 border-2 ${m.servingTeam === 'B' ? 'border-emerald-500 shadow-xl shadow-emerald-500/10' : 'border-slate-800'} rounded-3xl p-6 sm:p-8 flex flex-col justify-between relative transition-all">
                        ${m.servingTeam === 'B' ? '<div class="absolute top-4 right-4 px-3 py-1 bg-emerald-500 text-slate-950 font-black text-xs rounded-full flex items-center gap-1 shadow"><i data-lucide="zap" class="w-3.5 h-3.5"></i> SERVING</div>' : ''}
                        <div>
                            <span class="text-xs font-black tracking-widest text-indigo-400 uppercase">${teamB.dept}</span>
                            <h3 class="text-3xl font-black text-white mt-1">${teamB.name}</h3>
                        </div>
                        <div class="bg-slate-950 rounded-2xl p-6 text-center border border-slate-800/80 my-6">
                            <span class="text-xs font-bold text-slate-500 uppercase block mb-1">Current Score</span>
                            <span class="text-8xl font-black text-white digital-font tracking-tight">${m.scoreB.toString().padStart(2, '0')}</span>
                        </div>
                        <div class="space-y-4">
                            <div class="flex items-center justify-between text-sm font-bold text-slate-400">
                                <span>Sets Won: <span class="text-indigo-400 font-extrabold text-xl">${m.setsB}</span></span>
                                <span class="px-3 py-1 bg-slate-800 rounded-lg text-xs">Set ${m.currentSet} of ${state.settings.maxSets}</span>
                            </div>
                            <button onclick="addPoint('B')" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-black rounded-2xl text-base shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center space-x-2">
                                <i data-lucide="plus-circle" class="w-5 h-5"></i><span>+1 Point Team B</span>
                            </button>
                        </div>
                    </div>
                `;
            }
            lucide.createIcons();
        }

        window.onload = function() {
            renderAll();
        };
    </script>
</body>
</html>
