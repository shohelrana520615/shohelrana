<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TV Scoreboard - JL Fashions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .digital-font { font-family: 'Courier New', Courier, monospace; font-weight: 900; }
        .score-pop { animation: pop 0.3s ease-out; }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.15); color: #818cf8; } 100% { transform: scale(1); } }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col p-3 sm:p-6 md:p-8">

    <!-- Top Bar -->
    <div class="flex items-center justify-between border-b border-slate-800 pb-3 sm:pb-5">
        <div class="flex items-center space-x-2.5 sm:space-x-4">
            <div class="w-10 h-10 sm:w-14 sm:h-14 bg-indigo-600 rounded-xl sm:rounded-2xl flex items-center justify-center font-black text-lg sm:text-2xl text-white shadow-lg shadow-indigo-500/30 flex-shrink-0">
                JL
            </div>
            <div>
                <h2 class="text-base sm:text-2xl md:text-3xl font-black uppercase tracking-tight leading-tight">JL Fashions Arena</h2>
                <p id="tvMatchMeta" class="text-[11px] sm:text-sm md:text-base font-bold text-indigo-400 tracking-wider">Loading Arena...</p>
            </div>
        </div>
        <button onclick="toggleModal(true)" class="px-3 py-2 sm:px-5 sm:py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl sm:rounded-2xl text-xs sm:text-sm font-black flex items-center space-x-1.5 sm:space-x-2 transition-all shadow-lg flex-shrink-0">
            <i data-lucide="bar-chart-2" class="w-4 h-4 sm:w-5 sm:h-5"></i>
            <span>Standings</span>
        </button>
    </div>

    <!-- Main Scoreboard Container -->
    <div class="flex-1 flex items-center justify-center py-4 sm:py-8">
        <div id="tvScoreDisplay" class="w-full max-w-7xl grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-8">
            <!-- Score cards inserted dynamically -->
        </div>
    </div>

    <!-- Footer -->
    <div class="border-t border-slate-800 pt-3 sm:pt-4 flex items-center justify-between text-[11px] sm:text-sm font-bold text-slate-500">
        <span>JL Fashions Ltd. Scoreboard</span>
        <span class="flex items-center gap-2 text-emerald-400">
            <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-ping"></span>
            LIVE
        </span>
    </div>

    <!-- Standings Modal -->
    <div id="tvPointsModal" class="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-xl hidden flex items-center justify-center p-3 sm:p-6">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl sm:rounded-[32px] w-full max-w-5xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 sm:p-6 border-b border-slate-800 flex items-center justify-between bg-slate-950/50">
                <div class="flex items-center space-x-3">
                    <i data-lucide="trophy" class="w-6 h-6 sm:w-8 sm:h-8 text-indigo-500"></i>
                    <h3 class="text-lg sm:text-2xl font-black">Tournament Standings</h3>
                </div>
                <button onclick="toggleModal(false)" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-xl transition-all">
                    <i data-lucide="x" class="w-5 h-5 sm:w-6 sm:h-6"></i>
                </button>
            </div>
            <div id="tvModalStandingsContainer" class="p-4 sm:p-6 overflow-y-auto grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                <!-- Standings tables inserted dynamically -->
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://jl-badminton-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let cachedState = null;
        let prevScores = { a: 0, b: 0 };

        db.ref("tournament_state").on("value", (snapshot) => {
            const state = snapshot.val();
            if (state) {
                cachedState = state;
                renderTvView(state);
                renderTvStandings(state);
            }
        });

        function renderTvView(state) {
            const m = state.fixtures?.find(x => x.id === state.activeMatchId) || state.fixtures?.find(x => x.status === "LIVE") || state.fixtures?.[0];
            const display = document.getElementById("tvScoreDisplay");
            const meta = document.getElementById("tvMatchMeta");

            if (!m) {
                meta.innerText = "Waiting for match...";
                display.innerHTML = `<div class="col-span-2 text-center text-slate-600 text-lg sm:text-2xl font-bold italic py-12">No Live Match at the Moment</div>`;
                return;
            }

            const tA = state.teams?.find(t => t.id === m.teamA) || { name: "Team A", dept: "-" };
            const tB = state.teams?.find(t => t.id === m.teamB) || { name: "Team B", dept: "-" };

            meta.innerText = `${m.court || 'Court 1'} • ${(m.stage || 'STAGE').toUpperCase()} (${state.settings?.targetPoints || 21} PTS TARGET)`;

            const scoreAClass = (m.scoreA || 0) !== prevScores.a ? 'score-pop' : '';
            const scoreBClass = (m.scoreB || 0) !== prevScores.b ? 'score-pop' : '';
            prevScores = { a: m.scoreA || 0, b: m.scoreB || 0 };

            display.innerHTML = `
                ${renderTvCard(tA, m.scoreA || 0, m.setsA || 0, m.currentSet || 1, 'A', m.servingTeam, scoreAClass, state.settings?.maxSets || 3)}
                ${renderTvCard(tB, m.scoreB || 0, m.setsB || 0, m.currentSet || 1, 'B', m.servingTeam, scoreBClass, state.settings?.maxSets || 3)}
            `;
            lucide.createIcons();
        }

        function renderTvCard(team, score, sets, currentSet, side, servingTeam, animClass, maxSets) {
            const isServing = servingTeam === side;
            return `
                <div class="bg-slate-900 border-2 sm:border-4 ${isServing ? 'border-emerald-500 shadow-xl shadow-emerald-500/10' : 'border-slate-800'} rounded-2xl sm:rounded-[32px] p-5 sm:p-8 flex flex-col justify-between relative transition-all">
                    ${isServing ? '<div class="absolute -top-3.5 right-4 sm:right-6 px-3 py-1 bg-emerald-500 text-slate-950 font-black text-[10px] sm:text-xs rounded-full shadow-lg">SERVING NOW</div>' : ''}
                    <div>
                        <span class="text-[10px] sm:text-xs font-bold tracking-widest text-indigo-400 uppercase">${team.dept}</span>
                        <h3 class="text-xl sm:text-4xl font-black text-white mt-0.5 truncate">${team.name}</h3>
                    </div>
                    <div class="bg-slate-950 rounded-xl sm:rounded-2xl p-4 sm:p-8 text-center border border-slate-800 my-3 sm:my-6">
                        <span class="text-[10px] sm:text-xs font-bold text-slate-500 uppercase tracking-widest block mb-1">Score</span>
                        <span class="text-6xl sm:text-8xl md:text-[9rem] leading-none font-black text-white digital-font ${animClass}">${score.toString().padStart(2, '0')}</span>
                    </div>
                    <div class="flex items-center justify-between text-xs sm:text-lg font-bold text-slate-400">
                        <span>Sets Won: <span class="text-indigo-400 text-base sm:text-2xl">${sets}</span></span>
                        <span class="px-3 py-1 bg-slate-800 rounded-xl text-xs sm:text-sm">Set ${currentSet} / ${maxSets}</span>
                    </div>
                </div>
            `;
        }

        function renderTvStandings(state) {
            const container = document.getElementById("tvModalStandingsContainer");
            if (!container) return;
            const standings = {};
            (state.teams || []).forEach(t => {
                if (!standings[t.group]) standings[t.group] = [];
                standings[t.group].push({ id: t.id, name: t.name, played: 0, won: 0, lost: 0, pts: 0 });
            });

            (state.fixtures || []).filter(f => f.status === "COMPLETED").forEach(f => {
                const tA = state.teams?.find(t => t.id === f.teamA);
                const tB = state.teams?.find(t => t.id === f.teamB);
                if (tA && tB && standings[tA.group]) {
                    const g = tA.group;
                    const sA = standings[g]?.find(x => x.id === tA.id);
                    const sB = standings[g]?.find(x => x.id === tB.id);
                    if (sA && sB) {
                        sA.played++; sB.played++;
                        if (f.setsA > f.setsB) { sA.won++; sA.pts += (state.settings?.winPoints || 2); sB.lost++; sB.pts += (state.settings?.lossPoints || 0); }
                        else { sB.won++; sB.pts += (state.settings?.winPoints || 2); sA.lost++; sA.pts += (state.settings?.lossPoints || 0); }
                    }
                }
            });

            container.innerHTML = Object.keys(standings).map(grp => {
                const sorted = standings[grp].sort((a, b) => b.pts - a.pts);
                return `
                    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 sm:p-5">
                        <h4 class="text-base sm:text-xl font-black text-indigo-400 mb-3">${grp}</h4>
                        <table class="w-full text-left text-xs sm:text-sm">
                            <thead class="text-slate-500 font-bold">
                                <tr><th class="pb-2">Team</th><th class="pb-2 text-center">P</th><th class="pb-2 text-center">W</th><th class="pb-2 text-center">L</th><th class="pb-2 text-center">Pts</th></tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800">
                                ${sorted.map(t => `<tr><td class="py-2 font-bold">${t.name}</td><td class="text-center">${t.played}</td><td class="text-center">${t.won}</td><td class="text-center">${t.lost}</td><td class="text-center font-black text-indigo-300">${t.pts}</td></tr>`).join("")}
                            </tbody>
                        </table>
                    </div>
                `;
            }).join("");
        }

        function toggleModal(show) {
            const modal = document.getElementById("tvPointsModal");
            modal.classList.toggle("hidden", !show);
            modal.classList.toggle("flex", show);
        }
    </script>
</body>
</html>
